<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Annotation tool - demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#dcdcd4;--ac:#2f6fed;--bad:#d64545;--ok:#2e9b5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ececea;--mut:#9a9a94;--card:#222226;--bd:#3a3a40;--ac:#6b9bff;--bad:#ff7070;--ok:#5fd18f}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#ececea;--mut:#9a9a94;--card:#222226;--bd:#3a3a40;--ac:#6b9bff;--bad:#ff7070;--ok:#5fd18f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;z-index:5}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:6px;padding:4px 9px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}button.fix{background:var(--bad);border-color:var(--bad);color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.card img{width:140px;height:140px;image-rendering:pixelated;display:block;margin:0 auto 6px;background:#fff;border:1px solid var(--bd)}
.id{font-size:11px;color:var(--mut);word-break:break-all;text-align:center}
.row{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.cn{width:84px;font-weight:600}.cn.dis{color:var(--bad)}.mo{font-size:12px;color:var(--mut);flex:1;min-width:90px}.mo.dis{color:var(--bad);font-weight:600}
.bs{display:flex;gap:4px;flex-wrap:wrap}
textarea{width:calc(100% - 28px);margin:0 14px 14px;height:120px;background:var(--card);color:var(--fg);border:1px solid var(--bd)}

#grid{display:block;padding:0}.tabs button{padding:6px 14px}.badge{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--bd)}.badge.n{background:var(--ac);color:#fff}
.main{display:block}
#log{display:none;position:fixed;right:12px;bottom:12px;width:min(340px,calc(100% - 24px));max-height:55vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;font:12px/1.5 ui-monospace,monospace;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.25)}#log.open{display:block}
#log div{margin-bottom:8px;word-break:break-all}.note{color:var(--mut);font-size:12px;padding:8px 14px}
.cf{margin-top:8px;width:100%}.done{opacity:.55}.sug{font-size:11px;color:var(--ac);text-align:center}
</style></head><body>

const rot=v=>v,seg=(l)=>`main/${l[0]==='symmetric'?'Symmetric':'Assymetric'}/${l[4]==='has_bg_extras'?'BG':'plain'}/${l[5]==='regular'?'Regular':'Negative'}/${l[7]}`;

function render(){

 stat.textContent=`${L.filter(x=>done[x.i]).length}/${L.length} confirmed`;

 C.map((k,j)=>`<div class="row"><span class="cn">${k}</span><span class="bs">`+D.opts[k].map(v=>`<button data-i="${it.i}" data-j="${j}" data-v="${v}" class="${c[j]===v?(!it.new&&v!==it.l[j]?'fix':'on'):''}">${v}</button>`).join('')+'</span></div>').join('')+

}
function addLog(h){const L=document.getElementById('log'),d=document.createElement('div');d.innerHTML=h;L.insertBefore(d,L.children[1]);lg.textContent='Script log ('+(L.children.length-1)+')'}

 if(b.dataset.cf){const it=D.items.find(x=>x.i===b.dataset.cf),c=cur(it);done[it.i]=1;save();
  const moved=it.new||[0,4,5,7].some(j=>c[j]!==it.l[j]);

<script>
const q=v=>'"'+String(v).replace(/"/g,'""')+'"',ids=()=>D.items.filter(x=>done[x.i]);
function labelsCsv(){return [['img_id','file_name','status',...C].join(','),...ids().map(it=>[it.i,it.f,it.new?'new':'known',...cur(it)].map(q).join(','))].join('\n')}
function movesCsv(){return [['img_id','file_name','action','from','to'].join(','),...ids().map(it=>{const c=cur(it),mv=it.new||[0,4,5,7].some(j=>c[j]!==it.l[j]);
 return [it.i,it.f,mv?'move':'stay',it.new?'incoming/'+it.f:seg(it.l)+'/'+it.f,mv?seg(c)+'/'+it.f:seg(it.l)+'/'+it.f].map(q).join(',')})].join('\n')}
function show(n,f){cf=n;ta.value=f();ex.hidden=false}
exb.onclick=()=>{ex.hidden=!ex.hidden;if(!ex.hidden)show('labels',labelsCsv)};
e1.onclick=()=>show('labels',labelsCsv);e2.onclick=()=>show('moves',movesCsv);
cp.onclick=()=>{ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand('copy')}};
dl.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ta.value],{type:'text/csv'}));a.download=cf+'.csv';a.click()};
rs.onclick=()=>{st={};done={};save();ex.hidden=true;render()};
</script><script>
function plan(){return D.items.filter(x=>done[x.i]&&!mv[x.i]).map(it=>{const c=cur(it),m=it.new||[0,4,5,7].some(j=>c[j]!==it.l[j]);return {it,m,from:it.new?'incoming/'+it.f:seg(it.l)+'/'+it.f,to:(m?seg(c):seg(it.l))+'/'+it.f}})}
function movesCsv(){return [['img_id','file_name','action','from','to'].join(','),...D.items.filter(x=>mv[x.i]).map(it=>{const c=cur(it),m=mv[it.i]==='move';return [it.i,it.f,mv[it.i],it.new?'incoming/'+it.f:seg(it.l)+'/'+it.f,(m?seg(c):seg(it.l))+'/'+it.f].map(q).join(',')})].join('\n')}
ap.onclick=()=>{const p=plan();dr.hidden=false;
 dr.innerHTML=`<b>Dry run</b> (nothing moved yet): ${p.filter(x=>x.m).length} files will move, ${p.filter(x=>!x.m).length} stay in place.<div style="font:12px ui-monospace,monospace;margin:8px 0;max-height:180px;overflow:auto">`+(p.length?p.map(x=>`${x.m?'MOVE':'STAY'} ${x.from}${x.m?' → '+x.to:''}`).join('<br>'):'Nothing ready. Confirm some images first.')+'</div>'+(p.length?'<button id="go" class="on">Run moves</button> ':'')+'<button id="no">Cancel</button>';
 no.onclick=()=>{dr.hidden=true};
 if(p.length)go.onclick=()=>{p.forEach(x=>{mv[x.it.i]=x.m?'move':'stay'});save();dr.hidden=true;addLog(`<b>Apply moves</b><br>${p.filter(x=>x.m).length} files moved, moves.csv written`);render();show('moves',movesCsv)}};
rs.onclick=()=>{st={};done={};mv={};save();ex.hidden=true;dr.hidden=true;render()};
</script><script>lg.onclick=()=>document.getElementById('log').classList.toggle('open')</script></body></html>
